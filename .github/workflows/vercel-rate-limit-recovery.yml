name: Recover Vercel production after rate limit

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: write

concurrency:
  group: vercel-production-recovery
  cancel-in-progress: false

jobs:
  recover:
    if: github.repository == 'Arborwise/Arbor-OS'
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check whether editable Arborwise OS is already live
        id: live
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://arborwise-os.vercel.app'
          BUST="recovery-$(date +%s)"
          board_code=$(curl -sS -L --connect-timeout 10 --max-time 30 -o /tmp/board.html -w '%{http_code}' -H 'Cache-Control: no-cache' "$BASE/board-now.html?board=69&$BUST" || true)
          manifest_code=$(curl -sS -L --connect-timeout 10 --max-time 30 -o /tmp/manifest.json -w '%{http_code}' -H 'Cache-Control: no-cache' "$BASE/board-manifest.webmanifest?$BUST" || true)
          owner_code=$(curl -sS -L --connect-timeout 10 --max-time 30 -o /tmp/owner-edit.js -w '%{http_code}' -H 'Cache-Control: no-cache' "$BASE/owner-edit-69.js?$BUST" || true)
          api_code=$(curl -sS -L --connect-timeout 10 --max-time 30 -o /tmp/board-api.json -w '%{http_code}' -H 'Cache-Control: no-cache' "$BASE/api/board" || true)
          if [[ "$board_code" == '200' && "$manifest_code" == '200' && "$owner_code" == '200' && "$api_code" == '401' ]] \
            && grep -Fq '/board-live-54.js?board=69' /tmp/board.html \
            && grep -Fq '/owner-edit-69.js?board=69' /tmp/board.html \
            && grep -Fq 'NURTURE YOUR NATURE' /tmp/board.html \
            && grep -Fq 'board=69' /tmp/manifest.json \
            && grep -Fq 'OWNER ACCESS' /tmp/owner-edit.js \
            && grep -Fq '/api/owner-edit' /tmp/owner-edit.js; then
            echo 'live=true' >> "$GITHUB_OUTPUT"
            echo 'Editable Arborwise OS is already live. No deployment retry is needed.'
          else
            echo 'live=false' >> "$GITHUB_OUTPUT"
            echo "Current production is incomplete: board=$board_code manifest=$manifest_code owner=$owner_code protected-api=$api_code."
          fi

      - name: Respect the Vercel rate-limit cooldown
        id: cooldown
        if: steps.live.outputs.live != 'true'
        shell: bash
        run: |
          set -euo pipefail
          now=$(date +%s)
          latest_commit=$(git log -1 --format=%ct)
          marker='public/deploy-recovery-marker.txt'
          if [[ -f "$marker" ]]; then
            last_attempt=$(sed -n 's/^epoch=//p' "$marker" | head -n 1)
            last_attempt=${last_attempt:-0}
            minimum_wait=21600
            reason='six-hour retry spacing'
          else
            last_attempt=$latest_commit
            minimum_wait=3900
            reason='initial Vercel one-hour reset window'
          fi
          age=$((now-last_attempt))
          if (( age >= minimum_wait )); then
            echo 'eligible=true' >> "$GITHUB_OUTPUT"
            echo "Cooldown complete: $reason."
          else
            remaining=$((minimum_wait-age))
            echo 'eligible=false' >> "$GITHUB_OUTPUT"
            echo "Cooldown still active for about $remaining seconds; leaving production alone."
          fi

      - name: Trigger one controlled Vercel retry
        if: steps.live.outputs.live != 'true' && steps.cooldown.outputs.eligible == 'true'
        shell: bash
        run: |
          set -euo pipefail
          epoch=$(date +%s)
          stamp=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          printf 'epoch=%s\nutc=%s\nreason=controlled retry for editable Arborwise OS board 69\n' "$epoch" "$stamp" > public/deploy-recovery-marker.txt
          git config user.name 'Arborwise deployment recovery'
          git config user.email 'actions@users.noreply.github.com'
          git add public/deploy-recovery-marker.txt
          git commit -m 'Retry editable Arborwise OS after Vercel cooldown'
          git push origin HEAD:main

      - name: Verify the controlled production result
        if: steps.live.outputs.live != 'true' && steps.cooldown.outputs.eligible == 'true'
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://arborwise-os.vercel.app'
          for attempt in $(seq 1 40); do
            bust="verify-$(date +%s)-$attempt"
            board_code=$(curl -sS -L --connect-timeout 10 --max-time 30 -o /tmp/board.html -w '%{http_code}' -H 'Cache-Control: no-cache' "$BASE/board-now.html?board=69&$bust" || true)
            manifest_code=$(curl -sS -L --connect-timeout 10 --max-time 30 -o /tmp/manifest.json -w '%{http_code}' -H 'Cache-Control: no-cache' "$BASE/board-manifest.webmanifest?$bust" || true)
            owner_code=$(curl -sS -L --connect-timeout 10 --max-time 30 -o /tmp/owner-edit.js -w '%{http_code}' -H 'Cache-Control: no-cache' "$BASE/owner-edit-69.js?$bust" || true)
            api_code=$(curl -sS -L --connect-timeout 10 --max-time 30 -o /tmp/board-api.json -w '%{http_code}' -H 'Cache-Control: no-cache' "$BASE/api/board" || true)
            if [[ "$board_code" == '200' && "$manifest_code" == '200' && "$owner_code" == '200' && "$api_code" == '401' ]] \
              && grep -Fq '/board-live-54.js?board=69' /tmp/board.html \
              && grep -Fq '/owner-edit-69.js?board=69' /tmp/board.html \
              && grep -Fq 'NURTURE YOUR NATURE' /tmp/board.html \
              && grep -Fq 'board=69' /tmp/manifest.json \
              && grep -Fq 'OWNER ACCESS' /tmp/owner-edit.js \
              && grep -Fq '/api/owner-edit' /tmp/owner-edit.js; then
              echo 'Editable Arborwise OS is live and passed owner-access, privacy, manifest, and API checks.'
              exit 0
            fi
            echo "Waiting for controlled deployment; attempt $attempt returned board=$board_code manifest=$manifest_code owner=$owner_code protected-api=$api_code."
            sleep 15
          done
          echo 'Controlled deployment did not become live during the verification window.'
          exit 1
