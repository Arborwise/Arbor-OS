<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta name="robots" content="noindex,nofollow">
  <title>Opening Arborwise OS Board</title>
  <style>
    :root{color-scheme:light}
    *{box-sizing:border-box}
    body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#f7f2e8;color:#17402b;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-align:center}
    main{width:min(440px,100%);padding:30px 24px;border:2px solid #17402b;border-radius:22px;background:#fff;box-shadow:0 18px 45px rgba(23,64,43,.15)}
    h1{margin:0 0 10px;font-size:1.6rem}
    p{margin:0 0 20px;line-height:1.5}
    a{display:inline-flex;min-height:52px;align-items:center;justify-content:center;padding:12px 22px;border-radius:999px;background:#17402b;color:#fff;font-weight:900;text-decoration:none}
  </style>
  <script>
    (() => {
      const target = '/board-now.html?source=restored-board&board=81';
      try { window.location.replace(target); }
      catch (error) { window.location.href = target; }
    })();
  </script>
</head>
<body>
  <main>
    <h1>Opening the Arborwise board</h1>
    <p>This address now leads to the working Arborwise OS master board.</p>
    <a href="/board-now.html?source=restored-board&board=81">Open Arborwise OS Board</a>
  </main>

</html>
