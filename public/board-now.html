<html lang="en">
<head>
  <meta charset="utf-8">

  <meta name="theme-color" content="#1d4b34">
  <meta name="application-name" content="Arborwise OS">

  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>Arborwise OS Board</title>

  <style>
    html,body{background:#f7f2e8}
    body.booting{visibility:hidden}
    header{min-height:302px;padding-top:10px}
    header .logo{display:block;width:min(300px,68vw);height:90px;object-fit:contain;margin:0 auto}
    .annie{left:8px;bottom:83px}
    .connectionLinks{position:relative;z-index:20;display:flex;gap:9px;width:min(620px,92%);margin:10px auto 0}
    .connectionLinks a{flex:1;display:flex;align-items:center;justify-content:center;min-height:48px;border:2px solid #fff;border-radius:999px;background:#f7f2e8;color:#17402b;text-decoration:none;font-size:13px;font-weight:950;letter-spacing:.03em;box-shadow:0 3px 8px rgba(0,0,0,.25);touch-action:manipulation;pointer-events:auto;-webkit-user-select:none;user-select:none}
    .connectionLinks a.connected{background:#dff0e4;color:#155b2d;border-color:#b7d6c0}
    .connectionLinks a:active{transform:scale(.98)}

    /* The core board still owns these hidden buttons. The permanent visible control below clicks them. */
    #groupFilters54{position:absolute!important;width:1px!important;height:1px!important;overflow:hidden!important;clip:rect(0 0 0 0)!important;clip-path:inset(50%)!important;white-space:nowrap!important;padding:0!important;border:0!important;margin:-1px!important}
    #filters button[data-filter="KW"]{display:none!important}
    #propertyManagementGroups75{display:grid;gap:8px;position:relative;z-index:70;padding:9px 10px;background:#ebe9df;border-bottom:1px solid #d9d6ca;overflow:visible}
    .pmgLevel75{position:relative;width:100%}
    .pmgLevel75[hidden]{display:none!important}
    .pmgTrigger75{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:8px;width:100%;min-height:52px;padding:9px 13px;border:2px solid #17402b;border-radius:13px;background:#fff;color:#17402b;text-align:left;font:inherit;font-weight:950;touch-action:manipulation}
    .pmgTrigger75 span{letter-spacing:.025em}
    .pmgTrigger75 small{font-size:11px;color:#5d675f;text-align:right;letter-spacing:.02em}
    .pmgTrigger75 b{font-size:18px}
    #pmgSbbTrigger75{background:#e4efe6;border-color:#2b6441}
    .pmgMenu75{position:absolute;z-index:140;left:0;right:0;top:57px;padding:7px;border:2px solid #17402b;border-radius:13px;background:#f7f2e8;box-shadow:0 8px 20px rgba(15,46,30,.25)}
    .pmgMenu75 button{display:block;width:100%;min-height:47px;margin:3px 0;padding:10px 12px;border:0;border-radius:9px;background:#fff;color:#17402b;text-align:left;font:inherit;font-weight:900;touch-action:manipulation}
    .pmgMenu75 button[aria-checked="true"]{background:#17402b;color:#fff}
    #pmgSbbMenu75 button[aria-checked="true"]{background:#2b6441}
    @media(max-width:390px){
      .connectionLinks{gap:7px;width:94%}
      .connectionLinks a{min-height:46px;font-size:11px;padding:0 6px}
      .pmgTrigger75{grid-template-columns:1fr auto;min-height:50px}
      .pmgTrigger75 small{grid-column:1 / -1;text-align:left;margin-top:-4px}
      .pmgTrigger75 b{position:absolute;right:14px;top:14px}
    }
  </style>
  <link rel="stylesheet" href="/arborwise-personality-49.css?board=75">
  <noscript><style>body.booting{visibility:visible}</style></noscript>
  <script>
    try{
      if('serviceWorker' in navigator){
        navigator.serviceWorker.register=function(){return Promise.resolve(null);};
        navigator.serviceWorker.getRegistrations()
          .then(registrations=>Promise.all(registrations.map(registration=>registration.unregister())))
          .catch(()=>{});
      }
      if('caches' in window){
        caches.keys().then(keys=>Promise.all(keys.map(key=>caches.delete(key)))).catch(()=>{});
      }
    }catch(error){}
  </script>
</head>
<body class="booting">
<header>
  <button id="syncButton" class="sync" type="button" aria-label="Refresh Arborwise operations from Google Sheets, Calendar, and QuickBooks">
    <span class="syncIcon">↻</span><span>REFRESH</span>
  </button>
  <div id="weatherChip" class="weatherChip" role="status" aria-live="polite" aria-label="Loading Van Alstyne weather">WX …</div>
  <img class="logo" src="/assets/arborwise-logo.png?board=75" alt="Arborwise">
  <div class="brandTagline" aria-label="Arborwise motto">NURTURE YOUR NATURE</div>
  <div id="dateLine" class="dateLine"></div>
  <button id="statusButton" class="status" type="button">OPENING LIVE OPERATIONS</button>
  <div class="connectionLinks" aria-label="Arborwise connections">
    <a id="connectGoogleDirect" href="#">CONNECT GOOGLE</a>
    <a id="connectQuickBooksDirect" href="#">CONNECT QUICKBOOKS</a>
  </div>
  <div id="operationsVoice" class="operationsVoice" aria-live="polite">Reading the current Arborwise operation...</div>
</header>
<section id="filters" class="filters" aria-label="Crew filters"></section>
<section id="propertyManagementGroups75" aria-label="Property management group filters">
  <div class="pmgLevel75">
    <button id="pmgMainTrigger75" class="pmgTrigger75" type="button" aria-haspopup="true" aria-expanded="false">
      <span>PROPERTY MANAGEMENT GROUPS</span><small id="pmgMainLabel75">ALL CUSTOMERS</small><b aria-hidden="true">▾</b>
    </button>
    <div id="pmgMainMenu75" class="pmgMenu75" role="menu" hidden>
      <button type="button" role="menuitemradio" data-pmg-main="ALL">ALL CUSTOMERS</button>
      <button type="button" role="menuitemradio" data-pmg-main="RESIDENTIAL">RESIDENTIAL / HOMEOWNERS</button>
      <button type="button" role="menuitemradio" data-pmg-main="SBB">SBB MANAGEMENT</button>
      <button type="button" role="menuitemradio" data-pmg-main="GOODWIN">GOODWIN</button>
      <button type="button" role="menuitemradio" data-pmg-main="KANAM">KANAM</button>
    </div>
  </div>
  <div id="pmgSbbLevel75" class="pmgLevel75" hidden>
    <button id="pmgSbbTrigger75" class="pmgTrigger75" type="button" aria-haspopup="true" aria-expanded="false">
      <span>SBB MANAGEMENT WORK</span><small id="pmgSbbLabel75">ALL SBB WORK</small><b aria-hidden="true">▾</b>
    </button>
    <div id="pmgSbbMenu75" class="pmgMenu75" role="menu" hidden>
      <button type="button" role="menuitemradio" data-pmg-sbb="ALL">ALL SBB WORK</button>
      <button type="button" role="menuitemradio" data-pmg-sbb="ARBORWISE">ARBORWISE TREE WORK</button>
      <button type="button" role="menuitemradio" data-pmg-sbb="KW">KW LANDSCAPING LAWNS</button>
    </div>
  </div>
</section>
<main id="main">
  <div class="title"><span>Opening current operations</span></div>
  <div class="empty">Customer and financial data load only after authorized access.</div>
</main>
<button id="addButton" class="add" type="button" hidden aria-hidden="true"></button>
<button id="annieButton" class="annie" type="button" aria-label="Ask Annie">
  <img src="/assets/annie-main-icon.png?board=75" alt="Annie">
</button>
<div id="annieBubble" class="bubble" hidden></div>
<nav id="tabs" aria-label="Arborwise sections"></nav>
<div id="veil" class="veil" hidden><section id="sheet" class="sheet" role="dialog" aria-modal="true"></section></div>
<div id="toast" class="toast" hidden></div>

<script src="/board-live-54.js?board=75" defer></script>
<script src="/owner-edit-69.js?board=75" defer></script>
<script src="/completed-jobs-62.js?board=75" defer></script>
<script src="/voice-estimate-61.js?board=75" defer></script>
<script src="/annie-bubble-48.js?board=75" defer></script>
<script src="/weather-chip-48.js?board=75" defer></script>

<script>
window.addEventListener('DOMContentLoaded',()=>{
  const UI_KEY='arborwise-board-ui-v57';
  const SUB_KEY='arborwise-pmg-sbb-v75';
  const mainLabels={ALL:'ALL CUSTOMERS',RESIDENTIAL:'RESIDENTIAL / HOMEOWNERS',SBB:'SBB MANAGEMENT',GOODWIN:'GOODWIN',KANAM:'KANAM'};
  const subLabels={ALL:'ALL SBB WORK',ARBORWISE:'ARBORWISE TREE WORK',KW:'KW LANDSCAPING LAWNS'};
  const mainTrigger=document.getElementById('pmgMainTrigger75');
  const mainMenu=document.getElementById('pmgMainMenu75');
  const mainLabel=document.getElementById('pmgMainLabel75');
  const sbbLevel=document.getElementById('pmgSbbLevel75');
  const sbbTrigger=document.getElementById('pmgSbbTrigger75');
  const sbbMenu=document.getElementById('pmgSbbMenu75');
  const sbbLabel=document.getElementById('pmgSbbLabel75');
  if(!mainTrigger||!mainMenu||!mainLabel||!sbbLevel||!sbbTrigger||!sbbMenu||!sbbLabel)return;

  const readUi=()=>{try{return JSON.parse(localStorage.getItem(UI_KEY)||'{}')||{};}catch{return {};}};
  const readSub=()=>{try{const value=String(localStorage.getItem(SUB_KEY)||'ALL').toUpperCase();return subLabels[value]?value:'ALL';}catch{return 'ALL';}};
  const saveSub=value=>{try{localStorage.setItem(SUB_KEY,value);}catch{}};
  const activeMain=()=>{
    const active=document.querySelector('#groupFilters54 > button[data-group].on');
    const value=String(active?.dataset.group||readUi().group||'ALL').toUpperCase();
    return mainLabels[value]?value:'ALL';
  };
  const closeMenus=()=>{
    mainMenu.hidden=true;sbbMenu.hidden=true;
    mainTrigger.setAttribute('aria-expanded','false');
    sbbTrigger.setAttribute('aria-expanded','false');
  };
  const clickFresh=selector=>{
    const button=document.querySelector(selector);
    if(button){button.click();return true;}
    return false;
  };
  const applyCrewForSub=sub=>{
    const crew=sub==='KW'?'KW':sub==='ARBORWISE'?'ARBORWISE':'ALL';
    if(!clickFresh(`#filters button[data-filter="${crew}"]`))setTimeout(()=>clickFresh(`#filters button[data-filter="${crew}"]`),60);
  };
  const updateControl=()=>{
    const main=activeMain();
    const sub=main==='SBB'?readSub():'ALL';
    mainLabel.textContent=mainLabels[main];
    sbbLabel.textContent=subLabels[sub];
    sbbLevel.hidden=main!=='SBB';
    mainMenu.querySelectorAll('[data-pmg-main]').forEach(button=>button.setAttribute('aria-checked',String(button.dataset.pmgMain===main)));
    sbbMenu.querySelectorAll('[data-pmg-sbb]').forEach(button=>button.setAttribute('aria-checked',String(button.dataset.pmgSbb===sub)));
  };
  const chooseMain=value=>{
    closeMenus();
    if(value!=='SBB')saveSub('ALL');
    const target=()=>clickFresh(`#groupFilters54 > button[data-group="${value}"]`);
    if(!target())setTimeout(target,60);
    setTimeout(()=>applyCrewForSub(value==='SBB'?readSub():'ALL'),80);
    setTimeout(updateControl,130);
  };
  const chooseSub=value=>{
    saveSub(value);
    closeMenus();
    const selectSbb=()=>clickFresh('#groupFilters54 > button[data-group="SBB"]');
    if(!selectSbb())setTimeout(selectSbb,60);
    setTimeout(()=>applyCrewForSub(value),80);
    setTimeout(updateControl,130);
  };

  mainTrigger.onclick=event=>{
    event.preventDefault();event.stopPropagation();
    const opening=mainMenu.hidden;closeMenus();mainMenu.hidden=!opening;mainTrigger.setAttribute('aria-expanded',String(opening));
  };
  sbbTrigger.onclick=event=>{
    event.preventDefault();event.stopPropagation();
    const opening=sbbMenu.hidden;closeMenus();sbbMenu.hidden=!opening;sbbTrigger.setAttribute('aria-expanded',String(opening));
  };
  mainMenu.querySelectorAll('[data-pmg-main]').forEach(button=>button.onclick=event=>{event.preventDefault();event.stopPropagation();chooseMain(button.dataset.pmgMain);});
  sbbMenu.querySelectorAll('[data-pmg-sbb]').forEach(button=>button.onclick=event=>{event.preventDefault();event.stopPropagation();chooseSub(button.dataset.pmgSbb);});
  document.addEventListener('click',event=>{if(!event.target.closest('#propertyManagementGroups75'))closeMenus();});
  window.addEventListener('arborwise:data-ready',()=>setTimeout(updateControl,0));
  const observer=new MutationObserver(()=>updateControl());
  observer.observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['class']});
  updateControl();
  setTimeout(updateControl,250);
  setTimeout(updateControl,1200);
});
</script>
<script>
window.addEventListener('DOMContentLoaded',()=>{
  const statusButton=document.getElementById('statusButton');
  const refreshButton=document.getElementById('syncButton');
  const veil=document.getElementById('veil');
  const sheet=document.getElementById('sheet');
  const toast=document.getElementById('toast');
  const googleLink=document.getElementById('connectGoogleDirect');
  const quickBooksLink=document.getElementById('connectQuickBooksDirect');
  if(!statusButton||!veil||!sheet)return;

  const showToast=message=>{
    if(!toast)return;
    toast.textContent=message;
    toast.hidden=false;
    clearTimeout(showToast.timer);
    showToast.timer=setTimeout(()=>{toast.hidden=true;},5200);
  };
  const close=()=>{veil.hidden=true;sheet.innerHTML='';};
  const connectionRow=(name,provider)=>{
    const connectionState=provider.authorized?'CONNECTED':provider.configured?'APPROVAL NEEDED':'APP SETUP NEEDED';
    const detail=provider.authorized
      ? (provider.email||provider.realmId||'Ready to synchronize')
      : provider.configured
        ? `Tap Connect ${name} to approve Arborwise OS.`
        : `Missing ${Array.isArray(provider.missing)?provider.missing.join(' and '):'app credentials'}.`;
    const button=provider.connectUrl
      ? `<button class="primary wideButton" data-connect="${provider.connectUrl}">${provider.authorized?'RECONNECT':'CONNECT'} ${name.toUpperCase()}</button>`
      : '';
    return `<div class="card"><h3>${name}</h3><strong>${connectionState}</strong><p class="loginHelp">${detail}</p>${button}</div>`;
  };

  let latestConnections=null;
  const applyLink=(link,name,provider)=>{
    if(!link)return;
    const authorized=Boolean(provider?.authorized);
    link.classList.toggle('connected',authorized);
    link.textContent=authorized?`${name.toUpperCase()} CONNECTED`:`CONNECT ${name.toUpperCase()}`;
    link.href='#';
    link.onclick=event=>{
      event.preventDefault();
      if(!latestConnections){openConnections();return;}
      if(authorized){openConnections();return;}
      if(provider?.connectUrl)location.assign(provider.connectUrl);
      else openConnections();
    };
  };
  const readConnections=async()=>{
    const response=await fetch('/api/connections',{credentials:'same-origin',cache:'no-store'});
    if(response.status===401){
      latestConnections=null;
      return null;
    }
    let data={};
    try{data=await response.json();}catch{}
    if(!response.ok)throw new Error(data.error||`Connections check failed ${response.status}`);
    latestConnections=data;
    applyLink(googleLink,'Google',data.google);
    applyLink(quickBooksLink,'QuickBooks',data.quickbooks);
    return data;
  };
  const openConnections=async()=>{
    statusButton.disabled=true;
    try{
      const data=latestConnections||await readConnections();
      if(!data){
        showToast('Board access expired. Tap Refresh to reopen Arborwise OS.');
        if(refreshButton)refreshButton.click();
        return;
      }
      sheet.innerHTML=`<h2>Connections</h2>${connectionRow('Google',data.google||{})}${connectionRow('QuickBooks',data.quickbooks||{})}<div class="buttons"><button class="secondary" id="closeConnections">CLOSE</button></div>`;
      veil.hidden=false;
      document.getElementById('closeConnections').onclick=close;
      sheet.querySelectorAll('[data-connect]').forEach(button=>{
        button.onclick=()=>location.assign(button.dataset.connect);
      });
    }catch(error){
      showToast(error.message||'Could not open Connections.');
    }finally{
      statusButton.disabled=false;
    }
  };

  if(googleLink)googleLink.onclick=event=>{event.preventDefault();openConnections();};
  if(quickBooksLink)quickBooksLink.onclick=event=>{event.preventDefault();openConnections();};
  statusButton.title='Tap to open Google and QuickBooks connections';
  statusButton.setAttribute('aria-label','Open Google and QuickBooks connections');
  statusButton.onclick=openConnections;

  const refreshConnectionState=()=>{
    latestConnections=null;
    readConnections().catch(()=>{});
  };
  readConnections().catch(()=>{});
  window.addEventListener('arborwise:data-ready',refreshConnectionState);
  window.addEventListener('arborwise:connections-changed',refreshConnectionState);

  const connected=new URLSearchParams(location.search).get('connected');
  if(connected){
    const cleanUrl=`${location.pathname}${location.hash||''}`;
    history.replaceState({},'',cleanUrl);
    showToast(`${connected==='quickbooks'?'QuickBooks':'Google'} connected • refreshing operations`);
    setTimeout(()=>refreshButton?.click(),500);
  }
});
</script>
</body>
