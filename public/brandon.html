<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#174b31">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<title>Brandon • Arborwise Field Board</title>
<link rel="icon" type="image/svg+xml" href="/assets/annie-launcher-v42.svg">
<style>
:root{--forest:#174b31;--forest2:#103823;--paper:#f7f2e8;--ink:#203027;--line:#d8d0c2;--blue:#1976d2;--yellow:#f2c94c;--orange:#e87516;--green:#18864b}
*{box-sizing:border-box}html,body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}body{padding-bottom:26px}
header{background:linear-gradient(145deg,var(--forest2),var(--forest));color:#fff;padding:10px 12px 13px;box-shadow:0 4px 16px #0002;text-align:center;position:sticky;top:0;z-index:20}
.logo{display:block;width:min(185px,52vw);height:52px;object-fit:contain;margin:0 auto}.eyebrow{font-size:10px;font-weight:950;letter-spacing:.11em;color:#f0d58c}.title{font-size:20px;font-weight:1000;line-height:1.05;margin:3px 0}.date{font-size:11px;font-weight:850;color:#d9ebdf}.headrow{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:8px}.status,.refresh{min-height:36px;border-radius:999px;font-weight:950;font-size:11px}.status{display:flex;align-items:center;justify-content:center;padding:0 13px;background:#ffffff16;color:#fff;border:1px solid #ffffff55}.refresh{padding:0 15px;background:#f7f2e8;color:var(--forest);border:0}.refresh:active{transform:scale(.98)}
main{width:min(720px,96%);margin:10px auto}.hint{font-size:10px;text-align:center;color:#687068;font-weight:900;margin:2px 0 9px;letter-spacing:.04em}.section{display:flex;align-items:center;justify-content:space-between;margin:13px 0 7px;padding:9px 11px;border-radius:12px;background:var(--forest);color:#fff;font-size:12px;font-weight:1000;letter-spacing:.05em;text-transform:uppercase}.section.future{background:#dbeafa;color:#234f76;border:1px solid #8fb4da}.section.unscheduled{background:#eee7d9;color:#5b4d39;border:1px solid #c2b393}.section.completed{background:#e4e8e3;color:#485348;border:1px solid #a5afa4}.count{min-width:27px;height:27px;padding:0 8px;border-radius:999px;display:flex;align-items:center;justify-content:center;background:#ffffff22}.section.future .count,.section.unscheduled .count,.section.completed .count{background:#fff}
.card{background:#fff;border:1px solid var(--line);border-radius:15px;margin:0 0 9px;box-shadow:0 3px 10px #24372c10;overflow:hidden}.summary{padding:11px 12px 9px;cursor:pointer;touch-action:manipulation}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.leftTop{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.tag{font-size:9px;font-weight:1000;letter-spacing:.06em;padding:4px 6px;border-radius:6px;background:#e8f0eb;color:var(--forest)}.tag.est{background:#fff0d9;color:#8c5100}.rid{font-size:9px;font-weight:900;color:#7a817b}.amount{font-size:18px;font-weight:1000;color:var(--forest);white-space:nowrap}.name{font-size:18px;font-weight:1000;margin-top:5px}.when{font-size:11px;font-weight:900;color:#285478;margin-top:2px}.scope{font-size:12px;line-height:1.35;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.more{margin-top:6px;font-size:9px;font-weight:1000;letter-spacing:.06em;color:#66716a;text-transform:uppercase}.actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:0 10px 10px}.act{min-height:40px;border-radius:10px;text-decoration:none;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:1000;letter-spacing:.03em;border:0}.act.call{background:var(--green);color:#fff}.act.text{background:var(--blue);color:#fff}.act.email{background:var(--yellow);color:#302b18}.act.map{background:var(--orange);color:#fff}.act.disabled{opacity:.25;filter:grayscale(.5);pointer-events:none}.act:active{transform:scale(.97)}
.details{display:none;border-top:1px solid #ebe6dc;padding:11px 12px 12px;background:#fbfaf6}.card.open .details{display:block}.card.open .more:after{content:' • OPEN'}.detailLabel{font-size:9px;font-weight:1000;letter-spacing:.07em;color:#6b736d;text-transform:uppercase;margin:0 0 4px}.detailText{font-size:12px;line-height:1.48;white-space:pre-wrap}.detailText+.detailLabel{margin-top:10px}.pillrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.pill{font-size:9px;font-weight:950;padding:4px 6px;border-radius:999px;background:#edf1ee;color:#4a554c}.pill.status{background:#e7f2e9;color:#205b34}.pill.date{background:#edf5ff;color:#285478}
.empty,.error{padding:14px;border:1px solid var(--line);border-radius:13px;background:#fff;font-weight:850}.error{background:#f8e5e2;border-color:#ca8279;color:#7a302a}
#veil{position:fixed;inset:0;background:#0009;z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:12px}#login{width:min(520px,100%);background:#fff;border-radius:20px;padding:18px;box-shadow:0 20px 60px #0008}#login h2{margin:0 0 6px;font-size:21px}#login p{margin:0 0 12px;color:#5d655f;line-height:1.4;font-size:13px}#pin{width:100%;height:50px;border:1.5px solid #9da89f;border-radius:12px;padding:0 12px;font-size:18px}#open{width:100%;min-height:48px;margin-top:10px;border:0;border-radius:12px;background:var(--forest);color:#fff;font-weight:1000}#loginError{min-height:20px;margin-top:7px;font-size:12px;color:#8a3029;font-weight:850}
@media(max-width:390px){.amount{font-size:17px}.name{font-size:17px}.actions{gap:5px}.act{min-height:39px;font-size:9px}}
</style>
</head>
<body>
<header>
<img class="logo" src="/assets/arborwise-logo.png" alt="Arborwise">
<div class="eyebrow">CO-FOUNDER FIELD VIEW</div>
<div class="title">BRANDON • DAILY COMMAND</div>
<div id="date" class="date"></div>
<div class="headrow"><div id="status" class="status">OPENING LIVE BOARD</div><button id="refresh" class="refresh" type="button">REFRESH</button></div>
</header>
<main id="main"><div class="empty">Loading Brandon's schedule...</div></main>
<div id="veil" hidden><section id="login"><h2>Open Brandon's board</h2><p>Enter the Arborwise OS PIN. This co-founder view includes customer details and pricing.</p><input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="Arborwise OS PIN"><button id="open" type="button">OPEN BOARD</button><div id="loginError"></div></section></div>
<script>
'use strict';
(()=>{
const TZ='America/Chicago';
const main=document.getElementById('main'),status=document.getElementById('status'),refresh=document.getElementById('refresh'),veil=document.getElementById('veil'),pin=document.getElementById('pin'),openBtn=document.getElementById('open'),loginError=document.getElementById('loginError');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>{const n=Number(v||0);return n?new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(n):''};
const todayIso=()=>new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const friendly=iso=>{if(!iso)return '';const [y,m,d]=String(iso).slice(0,10).split('-').map(Number);return new Intl.DateTimeFormat('en-US',{timeZone:'UTC',weekday:'short',month:'short',day:'numeric'}).format(new Date(Date.UTC(y,m-1,d,12)));};
document.getElementById('date').textContent=new Intl.DateTimeFormat('en-US',{timeZone:TZ,weekday:'long',month:'long',day:'numeric',year:'numeric'}).format(new Date());
function isBrandon(r){return /brandon/i.test(String(r.who||r.assignedTo||r.assigned_to||r.crew||''));}
function typeOf(r){return String(r.type||r.kind||'job').toLowerCase().startsWith('est')?'ESTIMATE':'JOB';}
function scopeOf(r){return r.service||r.scope||r.description||'';}
function detailsOf(r){const parts=[];if(r.description&&r.description!==r.service)parts.push(r.description);if(r.notes)parts.push(r.notes);return parts.filter(Boolean).join('\n\n')||scopeOf(r)||'No additional details recorded.';}
function card(r){
 const phone=String(r.phone||'').replace(/[^0-9+]/g,'');
 const call=phone?`<a class="act call" href="tel:${esc(phone)}" onclick="event.stopPropagation()">CALL</a>`:'<span class="act call disabled">CALL</span>';
 const text=phone?`<a class="act text" href="sms:${esc(phone)}" onclick="event.stopPropagation()">TEXT</a>`:'<span class="act text disabled">TEXT</span>';
 const email=r.email?`<a class="act email" href="mailto:${esc(r.email)}" onclick="event.stopPropagation()">EMAIL</a>`:'<span class="act email disabled">EMAIL</span>';
 const map=r.address?`<a class="act map" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(r.address)}" onclick="event.stopPropagation()">MAP</a>`:'<span class="act map disabled">MAP</span>';
 const type=typeOf(r),date=String(r.workDate||r.work_date||'').slice(0,10),time=r.workTime||r.work_time||'',scope=scopeOf(r);
 return `<article class="card"><div class="summary" role="button" tabindex="0"><div class="top"><div class="leftTop"><span class="tag ${type==='ESTIMATE'?'est':''}">${type}</span><span class="rid">${esc(r.id||'')}</span></div><div class="amount">${money(r.amount)}</div></div><div class="name">${esc(r.name||r.customer_name||r.customer||'')}</div><div class="when">${date?esc(friendly(date)):'DATE TBD'}${time?' • '+esc(time):''}</div><div class="scope">${esc(scope||'No scope entered yet.')}</div><div class="more">Tap for full scope & details</div></div><div class="actions">${call}${text}${email}${map}</div><div class="details"><div class="detailLabel">Full scope / notes</div><div class="detailText">${esc(detailsOf(r))}</div>${r.address?`<div class="detailLabel">Address</div><div class="detailText">${esc(r.address)}</div>`:''}<div class="pillrow"><span class="pill status">${esc(r.status||'Open')}</span><span class="pill">${esc(r.who||r.assignedTo||r.assigned_to||r.crew||'Brandon')}</span>${date?`<span class="pill date">${esc(friendly(date))}${time?' • '+esc(time):''}</span>`:''}</div></div></article>`;
}
function section(cls,label,rows){if(!rows.length)return '';return `<div class="section ${cls}"><span>${label}</span><span class="count">${rows.length}</span></div>${rows.map(card).join('')}`;}
function render(items){
 const today=todayIso();
 const rows=items.filter(isBrandon).filter(r=>!/cancelled/i.test(String(r.status||'')));
 const active=rows.filter(r=>!/completed/i.test(String(r.status||'')));
 const todayRows=active.filter(r=>String(r.workDate||r.work_date||'').slice(0,10)===today);
 const future=active.filter(r=>{const d=String(r.workDate||r.work_date||'').slice(0,10);return d&&d>today;}).sort((a,b)=>String(a.workDate||a.work_date||'').localeCompare(String(b.workDate||b.work_date||''))||String(a.workTime||a.work_time||'').localeCompare(String(b.workTime||b.work_time||'')));
 const unscheduled=active.filter(r=>!String(r.workDate||r.work_date||'').slice(0,10));
 const completed=rows.filter(r=>/completed/i.test(String(r.status||''))).slice(0,6);
 main.innerHTML=`<div class="hint">BRANDON ONLY • COMPACT VIEW • PRICES INCLUDED</div>${section('', 'Today',todayRows)}${section('future','Coming Up',future)}${section('unscheduled','Needs Scheduling',unscheduled)}${section('completed','Recently Completed',completed)}${rows.length?'':'<div class="empty">No records currently assigned to Brandon.</div>'}`;
 main.querySelectorAll('.card').forEach(card=>{const s=card.querySelector('.summary');const toggle=()=>card.classList.toggle('open');s.onclick=toggle;s.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle();}};});
 status.textContent=`LIVE • ${rows.length} BRANDON ITEMS`;
}
async function req(path,options={}){const res=await fetch(path,{credentials:'same-origin',cache:'no-store',headers:{'Content-Type':'application/json',...(options.headers||{})},...options});let data={};try{data=await res.json();}catch{}if(!res.ok){const e=new Error(data.error||`Request failed ${res.status}`);e.status=res.status;throw e;}return data;}
async function load(){refresh.disabled=true;status.textContent='LOADING LIVE BOARD';try{const data=await req(`/api/board?ts=${Date.now()}`);veil.hidden=true;render(Array.isArray(data.items)?data.items:[]);}catch(e){if(e.status===401){veil.hidden=false;status.textContent='PIN REQUIRED';setTimeout(()=>pin.focus(),60);}else{main.innerHTML=`<div class="error">${esc(e.message)}</div>`;status.textContent='BOARD UNAVAILABLE';}}finally{refresh.disabled=false;}}
async function login(){const value=String(pin.value||'');if(!value){loginError.textContent='Enter the Arborwise OS PIN.';return;}openBtn.disabled=true;loginError.textContent='Opening...';try{await req('/api/login',{method:'POST',body:JSON.stringify({pin:value})});loginError.textContent='';await load();}catch(e){loginError.textContent=e.message||'Could not open board.';}finally{openBtn.disabled=false;}}
openBtn.onclick=login;pin.addEventListener('keydown',e=>{if(e.key==='Enter')login();});refresh.onclick=load;load();setInterval(load,5*60*1000);
})();
</script>
</body>
</html>
