<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#174b31">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <title>Arborwise Crew Board</title>
  <style>
    :root{--green:#174b31;--paper:#f7f2e8;--ink:#203027;--line:#d9d1c3;--blue:#dcecff;--blueInk:#234f76}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif;padding-bottom:38px}
    header{background:linear-gradient(145deg,#123725,#1d4b34);color:#fff;padding:14px 14px 18px;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.18)}
    header img{width:min(240px,68vw);height:76px;object-fit:contain}h1{font-size:18px;margin:3px 0 2px}.sub{font-size:12px;color:#dcebdd;font-weight:750}
    #status{margin:10px auto 0;width:min(520px,94%);padding:9px 12px;border-radius:999px;background:rgba(255,255,255,.13);font-size:12px;font-weight:850}
    main{width:min(700px,94%);margin:14px auto}
    .section{display:flex;justify-content:space-between;gap:12px;margin:17px 0 9px;padding:12px 14px;border:2px solid;border-radius:14px;font-size:15px;font-weight:950;text-transform:uppercase;letter-spacing:.05em}
    .section.today{background:var(--green);border-color:var(--green);color:#fff}.section.coming{background:var(--blue);border-color:#6e9fcf;color:var(--blueInk)}.section.unscheduled{background:#eee9de;border-color:#a99d88;color:#51483b}.section.completed{background:#e5e8e5;border-color:#98a398;color:#465048}
    .card{position:relative;margin:0 0 11px;padding:14px 14px 13px 18px;border:1px solid var(--line);border-radius:15px;background:#fff;box-shadow:0 3px 9px rgba(30,45,35,.07);overflow:hidden}.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:#4b83b8}.card.today{background:linear-gradient(90deg,#e8f5eb,#fff 40%);border-color:#70a67d}.card.today:before{background:#1f7042}.card.completed{opacity:.72;background:#f1f1ed}.card.completed:before{background:#7c8b7c}
    .top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.id{font-size:11px;font-weight:900;color:#657067}.status{padding:5px 8px;border-radius:999px;background:#e8eef7;color:#244f7d;font-size:11px;font-weight:900}.name{font-size:19px;font-weight:950;margin-top:4px}.address{font-size:13px;font-weight:750;margin-top:2px}.service{margin-top:8px;font-size:14px;line-height:1.35}.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.pill{padding:6px 8px;border:1px solid #9da89f;border-radius:999px;font-size:11px;font-weight:850;background:#f6f8f6}.pill.date{background:#edf6ff;border-color:#8db4d9;color:#234f76}.pill.crew{background:#fff6df;border-color:#cfaa69;color:#754d16}
    .actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:11px}.actions a{display:flex;align-items:center;justify-content:center;min-height:48px;border:1.5px solid var(--green);border-radius:12px;text-decoration:none;color:var(--green);background:#fff;position:relative;touch-action:manipulation}.actions a.text{border-color:#e4590c;color:#b8490a}.actions a.map{border-color:#d89a2b;color:#755000}.actions a svg{display:block;width:26px;height:26px;fill:currentColor}.actions a span{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.actions a:active{transform:scale(.96)}
    .notesBox{margin-top:12px;padding-top:11px;border-top:1px solid #e1ddd4}.notesBox label{display:block;font-size:12px;font-weight:950;margin-bottom:5px}.notesBox textarea{width:100%;min-height:74px;resize:vertical;border:1.5px solid #9ea9a1;border-radius:11px;padding:9px 10px;font:inherit;font-size:13px;line-height:1.35;background:#fff}.notesRow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:7px}.save{min-height:39px;padding:0 14px;border:0;border-radius:999px;background:var(--green);color:#fff;font-weight:950}.save:disabled{opacity:.55}.saved{font-size:11px;font-weight:800;color:#376244}
    .empty,.error{padding:16px;border-radius:13px;background:#fff;border:1px solid var(--line);font-weight:800}.error{background:#f8e6e3;border-color:#ca8279;color:#762f28}
  </style>
</head>
<body>
<header>
  <img src="/assets/arborwise-logo.png?crew=3" alt="Arborwise">
  <h1>Crew Board</h1>
  <div class="sub">Schedule, job details, contact tools, and crew notes — no prices</div>
  <div id="status">Opening current jobs…</div>
</header>
<main id="main"><div class="empty">Loading crew schedule…</div></main>
<script>
'use strict';
(() => {
  const access=new URLSearchParams(location.search).get('access')||'';
  const main=document.getElementById('main');
  const status=document.getElementById('status');
  const endpoint=`/api/crew-board?access=${encodeURIComponent(access)}`;
  const icons={
    call:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8a15.7 15.7 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.24c1.1.36 2.27.55 3.46.55A1.14 1.14 0 0 1 21 16.65V20a1.14 1.14 0 0 1-1.14 1.14A17 17 0 0 1 2.86 4.14 1.14 1.14 0 0 1 4 3h3.35A1.14 1.14 0 0 1 8.5 4.14c0 1.2.19 2.36.55 3.46a1 1 0 0 1-.25 1z"/></svg>',
    text:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-5 4v-4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm3 5h10v2H7zm0 4h7v2H7z"/></svg>',
    map:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 1 7 7c0 5-7 13-7 13S5 14 5 9a7 7 0 0 1 7-7zm0 4.5A2.5 2.5 0 1 0 12 11a2.5 2.5 0 0 0 0-5z"/></svg>'
  };
  const esc=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const todayIso=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/Chicago',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
  const friendly=iso=>{if(!iso)return '';const [y,m,d]=iso.split('-').map(Number);return new Intl.DateTimeFormat('en-US',{timeZone:'UTC',weekday:'short',month:'short',day:'numeric'}).format(new Date(Date.UTC(y,m-1,d,12)));};
  const contactAction=(kind,href,label,extra='')=>`<a class="${kind}" href="${href}" aria-label="${esc(label)}" title="${esc(label)}" ${extra}>${icons[kind]}<span>${kind.toUpperCase()}</span></a>`;
  function card(item,today){
    const phone=String(item.phone||'').replace(/[^0-9+]/g,'');
    const actions=[];
    if(phone){
      actions.push(contactAction('call',`tel:${esc(phone)}`,`Call ${item.customer||'customer'}`));
      actions.push(contactAction('text',`sms:${esc(phone)}`,`Text ${item.customer||'customer'}`));
    }
    if(item.address)actions.push(contactAction('map',`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.address)}`,`Map ${item.customer||'customer'}`,'target="_blank" rel="noopener"'));
    return `<article class="card ${item.workDate===today?'today':''} ${item.status==='Completed'?'completed':''}" data-id="${esc(item.id)}">
      <div class="top"><span class="id">${esc(item.id)}</span><span class="status">${esc(item.status)}</span></div>
      <div class="name">${esc(item.customer)}</div>
      ${item.address?`<div class="address">${esc(item.address)}</div>`:''}
      ${item.service?`<div class="service">${esc(item.service)}</div>`:''}
      <div class="meta">${item.workDate?`<span class="pill date">${esc(friendly(item.workDate))}${item.workTime?' • '+esc(item.workTime):''}</span>`:'<span class="pill">Needs a date</span>'}<span class="pill crew">${esc(item.crew)}</span>${item.equipment?`<span class="pill">${esc(item.equipment)}</span>`:''}</div>
      ${actions.length?`<div class="actions">${actions.join('')}</div>`:''}
      <div class="notesBox"><label for="notes-${esc(item.id)}">CREW NOTES</label><textarea id="notes-${esc(item.id)}" maxlength="2000">${esc(item.notes)}</textarea><div class="notesRow"><span class="saved" aria-live="polite"></span><button class="save" type="button">SAVE NOTES</button></div></div>
    </article>`;
  }
  function section(kind,label,count){return `<div class="section ${kind}"><span>${label}</span><span>${count}</span></div>`;}
  function render(items){
    const today=todayIso();
    const groups={today:[],coming:[],unscheduled:[],completed:[]};
    items.forEach(item=>{
      if(item.status==='Completed'){groups.completed.push(item);return;}
      if(!item.workDate){groups.unscheduled.push(item);return;}
      if(item.workDate===today){groups.today.push(item);return;}
      if(item.workDate>today){groups.coming.push(item);return;}
      groups.unscheduled.push(item);
    });
    const sort=(a,b)=>String(a.workDate||'9999').localeCompare(String(b.workDate||'9999'))||String(a.workTime||'').localeCompare(String(b.workTime||''));
    Object.values(groups).forEach(list=>list.sort(sort));
    let html='';
    html+=section('today','Today',groups.today.length)+(groups.today.length?groups.today.map(item=>card(item,today)).join(''):'<div class="empty">No jobs scheduled for today.</div>');
    if(groups.coming.length)html+=section('coming','Coming Up',groups.coming.length)+groups.coming.map(item=>card(item,today)).join('');
    if(groups.unscheduled.length)html+=section('unscheduled','Unscheduled / Review',groups.unscheduled.length)+groups.unscheduled.map(item=>card(item,today)).join('');
    if(groups.completed.length)html+=section('completed','Completed',groups.completed.length)+groups.completed.slice(0,12).map(item=>card(item,today)).join('');
    main.innerHTML=html;
    main.querySelectorAll('.card').forEach(article=>{
      const button=article.querySelector('.save');
      const textarea=article.querySelector('textarea');
      const saved=article.querySelector('.saved');
      button.onclick=async()=>{
        button.disabled=true;saved.textContent='Saving…';
        try{
          const response=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:article.dataset.id,notes:textarea.value})});
          const data=await response.json().catch(()=>({}));
          if(!response.ok)throw new Error(data.error||`Save failed ${response.status}`);
          saved.textContent='Saved to Jobs sheet';
        }catch(error){saved.textContent=error.message||'Could not save';}
        finally{button.disabled=false;}
      };
    });
  }
  async function load(){
    if(!access){main.innerHTML='<div class="error">This crew link is incomplete.</div>';status.textContent='LINK REQUIRED';return;}
    try{
      const response=await fetch(endpoint,{cache:'no-store'});
      const data=await response.json().catch(()=>({}));
      if(!response.ok)throw new Error(data.error||`Load failed ${response.status}`);
      render(Array.isArray(data.items)?data.items:[]);
      status.textContent=`LIVE CREW BOARD • ${data.items.length} JOBS • NOTES EDITABLE`;
    }catch(error){main.innerHTML=`<div class="error">${esc(error.message||'Could not open crew board')}</div>`;status.textContent='BOARD UNAVAILABLE';}
  }
  load();
  setInterval(load,5*60*1000);
})();
</script>
<script src="/contact-icons-66.js?v=66"></script>
</body>
</html>
